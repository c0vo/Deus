[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
asyncio_mode = auto
markers =
    slow: Tests that train ML models or make real network calls.
    frontend: Tests that require Node.js for frontend builds.
    e2e: End-to-end tests against the mock backend.
    database: Tests that create real SQLite databases.
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
log_cli = false
